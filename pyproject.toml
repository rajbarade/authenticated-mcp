[project]
name = "authenticated-mcp"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp==4.1.3",
    "httpx==0.28.1",
    "pydantic-settings==2.16.1",
    "pyjwt[crypto]==2.15.1",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
