name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install uv==0.12.23
      - run: make check
      - run: docker build -t authenticated-mcp:test .
      - name: Container startup and authentication smoke
        run: |
          trap 'docker rm -f mcp-smoke' EXIT
          docker run -d --name mcp-smoke --env-file .env.example --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges authenticated-mcp:test
          docker exec -i mcp-smoke python < scripts/container_smoke.py
