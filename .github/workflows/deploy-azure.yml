name: Deploy voice-mcp

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-mcp-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check publish-profile secret is configured
        env:
          HAS_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}
        run: |
          if [ "$HAS_PUBLISH_PROFILE" != "true" ]; then
            echo "::error::Add repository secret AZURE_WEBAPP_PUBLISH_PROFILE for voice-mcp, then rerun this workflow. No deployment was attempted."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - name: Install pinned tooling and validate source
        run: |
          python -m pip install uv==0.12.23
          make check
          bash -n startup.sh
      - name: Package source with locked runtime requirements
        run: |
          mkdir deploy-package
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file deploy-package/requirements.txt
          sed -i '1i--require-hashes' deploy-package/requirements.txt
          cp -R app deploy-package/app
          find deploy-package/app -type d -name __pycache__ -prune -exec rm -rf {} +
          cp startup.sh .deployment deploy-package/
          printf '%s\n' "$GITHUB_SHA" > deploy-package/DEPLOYMENT_COMMIT
          cd deploy-package
          zip -qr ../voice-mcp.zip .
      - name: Deploy Python source to voice-mcp
        id: deploy
        uses: azure/webapps-deploy@b686016b4de8820a23519503685d8d03fbfa03a6 # v3
        with:
          app-name: voice-mcp
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: voice-mcp.zip
      - name: Record completed source deployment
        run: |
          echo "Source deployment accepted for commit $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          echo 'Target: voice-mcp. Public endpoint checks run next; deployment acceptance alone does not prove app health or OAuth.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify public health and authentication discovery
        run: python scripts/verify_azure.py
