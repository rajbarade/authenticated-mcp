name: Deploy Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-appservice-${{ vars.AZURE_WEBAPP_NAME || 'unconfigured' }}
  cancel-in-progress: false

jobs:
  deploy:
    # A copied repository cannot deploy until its owner explicitly opts in.
    if: github.ref == 'refs/heads/main' && vars.ENABLE_AZURE_DEPLOYMENT == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MCP_PUBLIC_URL: ${{ vars.MCP_PUBLIC_URL }}
    steps:
      - name: Check publish-profile secret is configured
        env:
          HAS_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}
        run: |
          if [ "$HAS_PUBLISH_PROFILE" != "true" ]; then
            echo "::error::Add repository secret AZURE_WEBAPP_PUBLISH_PROFILE for the intended target app, then rerun this workflow. No deployment was attempted."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - name: Validate explicit deployment destination
        env:
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          if [ -z "$AZURE_WEBAPP_NAME" ]; then
            echo "::error::Set repository variable AZURE_WEBAPP_NAME. No deployment was attempted."
            exit 1
          fi
          python -c 'from scripts.verify_azure import configured_resource; configured_resource()'
      - name: Install pinned tooling and validate source
        run: |
          python -m pip install uv==0.12.23
          make check
          bash -n startup.sh
      - name: Package source with locked runtime requirements
        run: |
          mkdir deploy-package
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file deploy-package/requirements.txt
          sed -i '1i--require-hashes' deploy-package/requirements.txt
          cp -R app deploy-package/app
          find deploy-package/app -type d -name __pycache__ -prune -exec rm -rf {} +
          cp startup.sh .deployment deploy-package/
          printf '%s\n' "$GITHUB_SHA" > deploy-package/DEPLOYMENT_COMMIT
          cd deploy-package
          zip -qr ../mcp-source.zip .
      - name: Deploy Python source to configured App Service
        id: deploy
        uses: azure/webapps-deploy@b686016b4de8820a23519503685d8d03fbfa03a6 # v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: mcp-source.zip
      - name: Record completed source deployment
        run: |
          echo "Source deployment accepted for commit $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          echo 'Configured target uploaded. Public endpoint checks run next; deployment acceptance alone does not prove app health or OAuth.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify public health and authentication discovery
        run: python scripts/verify_azure.py
